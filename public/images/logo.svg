<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <mask id="cutout">
      <rect width="512" height="512" fill="white" />
      
      <!-- Inner Roof Line (Chevron) -->
      <path d="M 256 120 L 80 260 L 100 280 L 256 160 L 412 280 L 432 260 Z" fill="black" />
      
      <!-- Faucet -->
      <!-- Spout -->
      <path d="M 450 320 L 320 320 C 300 320 290 330 290 350 L 290 370 L 330 370 L 330 360 L 450 360 Z" fill="black" />
      <!-- Handle -->
      <rect x="350" y="250" width="16" height="70" rx="4" fill="black" />
      <rect x="315" y="275" width="86" height="16" rx="8" fill="black" />
      <!-- Drop -->
      <path d="M 310 395 C 310 395 285 435 285 455 C 285 471.5 296 485 310 485 C 324 485 335 471.5 335 455 C 335 435 310 395 310 395 Z" fill="black" />

      <!-- Wrench & Hand rotated 40 degrees -->
      <g transform="translate(120, 450) rotate(40)">
         <!-- Wrench Handle -->
         <line x1="0" y1="0" x2="0" y2="-180" stroke="black" stroke-width="28" stroke-linecap="round" />
         
         <!-- Wrench Head -->
         <!-- Fixed Upper Jaw -->
         <path d="M -14 -180 L -14 -240 C -14 -245, -10 -250, -5 -250 L 40 -250 L 40 -220 L 14 -220 L 14 -180 Z" fill="black" />
         <!-- Lower Adjustable Jaw -->
         <rect x="-14" y="-170" width="54" height="24" rx="4" fill="black" />
         <!-- Adjustment Nut -->
         <rect x="-10" y="-180" width="30" height="10" rx="2" fill="black" />

         <!-- Hand Gripping -->
         <!-- Arm Base -->
         <line x1="-5" y1="10" x2="-5" y2="-50" stroke="black" stroke-width="50" stroke-linecap="round" />
         <!-- Palm / Thumb Mass (Left side) -->
         <ellipse cx="-20" cy="-90" rx="25" ry="45" fill="black" />
         <circle cx="-15" cy="-140" r="18" fill="black" /> <!-- Thumb tip -->
         
         <!-- 4 Fingers (Right side wrapped around) -->
         <circle cx="20" cy="-120" r="18" fill="black" />
         <circle cx="25" cy="-95" r="18" fill="black" />
         <circle cx="25" cy="-70" r="18" fill="black" />
         <circle cx="20" cy="-45" r="18" fill="black" />
      </g>
    </mask>
  </defs>

  <!-- House Shape with Chimney -->
  <path d="M 256 30 L 20 220 L 60 260 L 80 240 L 80 480 L 432 480 L 432 240 L 452 260 L 492 220 Z" fill="#1e3a8a" mask="url(#cutout)" />
  <path d="M 370 60 L 370 160 L 430 200 L 430 60 Z" fill="#1e3a8a" mask="url(#cutout)" />
</svg>
